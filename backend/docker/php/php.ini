; Ajustes de producción sobre php.ini-production

; No revelar la versión de PHP en las cabeceras HTTP
expose_php = Off

memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 30

; Errores al log (stderr del contenedor), nunca al cliente
display_errors = Off
log_errors = On

; Caché de rutas de archivos: reduce llamadas stat() del autoloader
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache: mantiene el bytecode compilado en memoria
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; El código es inmutable dentro de la imagen: no hace falta revisar si los archivos cambiaron
opcache.validate_timestamps = 0
